[tool.poetry]
name = "steelpy"
version = "1.2.0"
description = "A simple library for section properties of AISC steel shapes"
authors = ["evanfaler <emfaler@gmail.com>"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["steel","AISC", "engineering", "shapes_AISC", "AISC Shapes Database v16.0"]
homepage = "https://github.com/evanfaler/steelpy"

[tool.poetry.dependencies]
python = "^3.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
